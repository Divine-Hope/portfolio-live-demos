[project]
name = "livedemos"
version = "0.1.0"
description = "Live data demos: public event streams in, embeddable analytics out."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.28",
    "httpx-sse>=0.4",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
# Browser tests for the widget. Kept out of `dev` so the everyday install stays small.
e2e = [
    "axe-playwright-python>=0.1.8",
    "playwright>=1.56",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livedemos"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = [
    "S608",  # SQL built from allowlisted constants only; see api/queries.py
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "ASYNC220"]  # tests spawn real processes
"src/livedemos/devtools/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["livedemos"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a running ClickHouse (make test-integration)",
    "e2e: drives the widget in a real browser against a running stack (make e2e)",
]
addopts = "-m 'not integration and not e2e'"
