name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint the workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.11.0"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infra
      - name: Validate each stack (no AWS credentials needed)
        run: |
          for stack in infra/bootstrap infra/live; do
            terraform -chdir=$stack init -backend=false -input=false
            terraform -chdir=$stack validate
          done

  terraform-plan:
    name: terraform plan (what merging would change)
    # Pull requests from this repo only: GitHub gives forks no OIDC token anyway.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # read-only role; see infra/live/ci.tf
    env:
      TF_VAR_budget_email: ${{ vars.TF_BUDGET_EMAIL }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}   # backend.hcl is per account, so not in git
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.11"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Plan, without the state lock (read-only; main's plan and apply take it)
        working-directory: infra/live
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=eu-west-1" >/dev/null
          terraform plan -input=false -no-color -lock=false -out=tfplan >plan.txt
          ../../deploy/ci/plan-summary.sh tfplan plan.txt >>"$GITHUB_STEP_SUMMARY"
          # The same check main runs before applying, so a destroy is caught at review.
          ../../deploy/ci/plan-digest.sh tfplan >/dev/null

  integration:
    name: integration tests and resume proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ci-admin
      # The application users, so the tests can check what they're refused.
      CLICKHOUSE_MIGRATOR_PASSWORD: ci-migrator
      CLICKHOUSE_INGEST_PASSWORD: ci-ingest
      CLICKHOUSE_API_PASSWORD: ci-api
    steps:
      - uses: actions/checkout@v4
      # Started by hand (not as a service) so it runs with our low-memory config and users.
      - name: Start ClickHouse with the project's config
        run: |
          docker run -d --name clickhouse -p 8123:8123 \
            -e CLICKHOUSE_USER=admin -e CLICKHOUSE_PASSWORD=ci-admin \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            -e CLICKHOUSE_MIGRATOR_PASSWORD=ci-migrator \
            -e CLICKHOUSE_INGEST_PASSWORD=ci-ingest -e CLICKHOUSE_API_PASSWORD=ci-api \
            -v "$PWD/clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro" \
            -v "$PWD/clickhouse/users.d/livedemos.xml:/etc/clickhouse-server/users.d/livedemos.xml:ro" \
            clickhouse/clickhouse-server:25.8
          for _ in $(seq 1 60); do curl -fsS localhost:8123/ping && break; sleep 1; done
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m integration -v
      - name: ClickHouse logs on failure
        if: failure()
        run: docker logs clickhouse | tail -100

  image:
    name: container image and compose file
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files (local, and production on top)
        run: |
          cp .env.example .env
          docker compose config --quiet
          IMAGE_TAG=0000000000000000000000000000000000000000 API_ORIGIN_SECRET=ci \
            docker compose -f compose.yaml -f compose.prod.yaml config --quiet
      - name: Lint the host scripts
        run: shellcheck deploy/host/*.sh deploy/ci/*.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: livedemos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stack:
    name: whole stack, offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack against the fake stream
        run: cp .env.example .env && make up-offline
      - name: Wait for live data
        run: |
          for _ in $(seq 1 60); do
            status=$(curl -fsS localhost:8080/v1/wikipedia/live.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' || true)
            [ "$status" = "live" ] && exit 0
            sleep 2
          done
          echo "no live data after 120 s"; exit 1
      - run: make smoke
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Browser tests for the widget (keyboard, screen reader, axe, reduced motion)
        run: |
          uv run --locked --group e2e playwright install --with-deps chromium
          uv run --locked --group e2e pytest -m e2e -v
      - run: docker compose --profile offline ps
      - name: Logs on failure
        if: failure()
        run: docker compose --profile offline logs --tail 100

  browsers:
    name: widget in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      LIVEDEMOS_E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack against the fake stream
        run: cp .env.example .env && make up-offline
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv run --locked --group e2e playwright install --with-deps ${{ matrix.browser }}
      - name: Wait for live data
        run: |
          for _ in $(seq 1 60); do
            status=$(curl -fsS localhost:8080/v1/wikipedia/live.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' || true)
            [ "$status" = "live" ] && exit 0
            sleep 2
          done
          echo "no live data after 120 s"; exit 1
      - run: uv run --locked --group e2e pytest -m e2e -v
      - name: Logs on failure
        if: failure()
        run: docker compose --profile offline logs --tail 100
