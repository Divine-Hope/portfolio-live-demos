name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Shared by every job. The values that hold the account ID or the email are secrets, set
# per job: only the Terraform jobs get them.
env:
  AWS_REGION: eu-west-1
  TF_VAR_grafana_cloud: ${{ vars.TF_GRAFANA_CLOUD }} # endpoints and user ids, not secret

jobs:
  checks:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint the workflows
        run: |
          # A pinned release, checked against its published checksum before it runs.
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  terraform:
    name: terraform fmt, validate, tflint, trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: tf
        run: echo "version=$(cat .terraform-version)" >>"$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infra
      - name: Validate each stack (no AWS credentials needed)
        run: |
          for stack in infra/bootstrap infra/live; do
            terraform -chdir=$stack init -backend=false -input=false
            terraform -chdir=$stack validate
          done
      - name: tflint (AWS ruleset)
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download, without the anonymous rate limit
        run: |
          # Pinned releases, checked against their published checksums before they run.
          curl -fsSLo tflint.zip https://github.com/terraform-linters/tflint/releases/download/v0.64.0/tflint_linux_amd64.zip
          echo "cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537  tflint.zip" | sha256sum -c -
          unzip -q tflint.zip tflint
          cd infra
          ../tflint --init
          ../tflint --recursive --config="$PWD/.tflint.hcl"
      - name: trivy config
        run: |
          curl -fsSLo trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          # Findings that are a cost choice are skipped inline, each with its reason.
          ./trivy config --quiet --exit-code 1 --severity MEDIUM,HIGH,CRITICAL infra

  terraform-plan:
    name: terraform plan (what merging would change)
    # Pull requests from this repo only: GitHub gives forks no OIDC token anyway.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # read-only role; see infra/live/ci.tf
    env:
      TF_VAR_budget_email: ${{ secrets.TF_BUDGET_EMAIL }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}   # holds the account ID, so a secret: GitHub masks secrets in logs
      TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: tf
        run: echo "version=$(cat .terraform-version)" >>"$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Plan, without the state lock (read-only; main's plan and apply take it)
        working-directory: infra/live
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION" >/dev/null
          terraform plan -input=false -no-color -lock=false -out=tfplan >/dev/null
          ../../deploy/ci/plan-summary.sh tfplan >>"$GITHUB_STEP_SUMMARY"
          # The same check main runs before applying, so a destroy is caught at review.
          ../../deploy/ci/plan-digest.sh tfplan >/dev/null

  integration:
    name: integration tests and resume proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ci-admin
      # The application users, so the tests can check what they're refused.
      CLICKHOUSE_MIGRATOR_PASSWORD: ci-migrator
      CLICKHOUSE_INGEST_PASSWORD: ci-ingest
      CLICKHOUSE_API_PASSWORD: ci-api
      CLICKHOUSE_ARCHIVER_PASSWORD: ci-archiver
      ARCHIVE_TEST_URL: http://s3:8333/archive/test   # as ClickHouse sees it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The archive tests need an S3 API that ClickHouse can reach by name, as in compose.
      - name: Start SeaweedFS (local S3) with an archive bucket
        run: |
          docker network create ci
          docker run -d --name s3 --network ci -p 127.0.0.1:8333:8333 chrislusf/seaweedfs:4.48 server -s3 -dir=/data
          for _ in $(seq 1 60); do
            docker exec s3 sh -c 'echo s3.bucket.list | weed shell -master=localhost:9333' 2>/dev/null |
              grep -q " archive" && break
            docker exec s3 sh -c 'echo "s3.bucket.create -name archive" | weed shell -master=localhost:9333' >/dev/null 2>&1 || true
            sleep 1
          done
      # Started by hand (not as a service) so it runs with our low-memory config and users.
      - name: Start ClickHouse with the project's config
        run: |
          docker run -d --name clickhouse --network ci -p 8123:8123 \
            -e CLICKHOUSE_USER=admin -e CLICKHOUSE_PASSWORD=ci-admin \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            -e CLICKHOUSE_MIGRATOR_PASSWORD=ci-migrator \
            -e CLICKHOUSE_INGEST_PASSWORD=ci-ingest -e CLICKHOUSE_API_PASSWORD=ci-api \
            -e CLICKHOUSE_ARCHIVER_PASSWORD=ci-archiver \
            -v "$PWD/clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro" \
            -v "$PWD/clickhouse/config.d/s3.xml:/etc/clickhouse-server/config.d/s3.xml:ro" \
            -v "$PWD/clickhouse/users.d/livedemos.xml:/etc/clickhouse-server/users.d/livedemos.xml:ro" \
            clickhouse/clickhouse-server:26.8
          for _ in $(seq 1 60); do curl -fsS localhost:8123/ping && break; sleep 1; done
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m integration -v
      - name: ClickHouse logs on failure
        if: failure()
        run: docker logs clickhouse | tail -100

  image:
    name: container image and compose file
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate compose files (local, and production on top)
        run: |
          cp .env.example .env
          docker compose config --quiet
          IMAGE_TAG=0000000000000000000000000000000000000000 API_ORIGIN_SECRET=ci \
            ARCHIVE_URL=https://example.invalid/wikipedia/edits \
            docker compose -f compose.yaml -f compose.prod.yaml config --quiet
      - name: Lint the host scripts
        run: shellcheck deploy/host/*.sh deploy/ci/*.sh
      - name: Validate the Alloy config
        run: docker run --rm -v "$PWD/deploy/alloy:/c:ro" grafana/alloy:v1.20.1 validate /c/config.alloy
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: livedemos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stack:
    name: whole stack, offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start the stack against the fake stream
        run: cp .env.example .env && make up-offline
      - name: Wait for live data
        run: make wait-live
      - run: make smoke
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Browser tests for the widget (keyboard, screen reader, axe, reduced motion)
        run: |
          uv run --locked --group e2e playwright install --with-deps chromium
          uv run --locked --group e2e pytest -m e2e -v
      - run: docker compose --profile offline ps
      - name: Logs on failure
        if: failure()
        run: docker compose --profile offline logs --tail 100

  browsers:
    name: widget in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      LIVEDEMOS_E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start the stack against the fake stream
        run: cp .env.example .env && make up-offline
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv run --locked --group e2e playwright install --with-deps ${{ matrix.browser }}
      - name: Wait for live data
        run: make wait-live
      - run: uv run --locked --group e2e pytest -m e2e -v
      - name: Logs on failure
        if: failure()
        run: docker compose --profile offline logs --tail 100
