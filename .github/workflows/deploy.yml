name: deploy

# Ships main to production after CI passes on it. To roll back (or forward), run it by
# hand with the commit SHA to deploy. Every run shows up under Deployments > production.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (empty for the head of main)
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/divine-hope/portfolio-live-demos

jobs:
  image:
    name: build the arm64 image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Pick the commit
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="${INPUT_SHA:-${RUN_SHA:-$GITHUB_SHA}}"
          if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::not a full commit SHA: $sha"
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.sha.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  deploy:
    name: deploy to the host
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.ready.outputs.url }}
    permissions:
      contents: read
      id-token: write   # for the OIDC token AWS trusts; no AWS keys are stored anywhere
    env:
      SHA: ${{ needs.image.outputs.sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Record the image tag
        run: aws ssm put-parameter --name /livedemos/image-tag --type String --value "$SHA" --overwrite >/dev/null

      - name: Run the deploy script on the host
        run: |
          instance=$(aws ssm get-parameter --name /livedemos-deploy/instance-id --query Parameter.Value --output text)
          params=$(jq -nc --arg cmd "/opt/livedemos/deploy/host/deploy.sh $SHA" '{commands: [$cmd]}')
          command=$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript \
            --comment "deploy $SHA" --parameters "$params" --query Command.CommandId --output text)

          status=Pending
          for _ in $(seq 1 90); do   # up to 7.5 minutes; most of it is the image pull
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success | Failed | Cancelled | TimedOut) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          if [ "$status" != Success ]; then
            echo "::error::deploy script ended with status $status"
            exit 1
          fi

      - name: Wait for /readyz through CloudFront
        id: ready
        run: |
          domain=$(aws ssm get-parameter --name /livedemos-deploy/api-domain --query Parameter.Value --output text)
          echo "url=https://$domain/v1/wikipedia/live.json" >>"$GITHUB_OUTPUT"
          for _ in $(seq 1 24); do   # 2 minutes
            if curl -fsS --max-time 5 "https://$domain/readyz"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "::error::/readyz wasn't green within 2 minutes of the deploy"
          exit 1
