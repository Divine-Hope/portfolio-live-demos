name: deploy

# Ships main to production after CI passes on it:
#
#   image -> infra plan -> infra apply (needs your approval, only if the plan changes
#   anything) -> app deploy
#
# Infrastructure goes first, so a release that needs a new secret or resource gets it
# before the app that uses it starts. To roll back (or forward) the app, run this by hand
# with a commit SHA: manual runs deploy the app only and never touch infrastructure, so an
# old commit can't revert AWS. Every run shows up under Deployments > production.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (empty for the head of main)
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/divine-hope/portfolio-live-demos

jobs:
  image:
    name: build the arm64 image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Pick the commit
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="${INPUT_SHA:-${RUN_SHA:-$GITHUB_SHA}}"
          if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::not a full commit SHA: $sha"
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.sha.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  infra-plan:
    name: terraform plan
    needs: image
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: infra-plan   # main only; no approval; read-only role
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      digest: ${{ steps.plan.outputs.digest }}
    env:
      TF_VAR_budget_email: ${{ secrets.TF_BUDGET_EMAIL }}
      TF_VAR_grafana_cloud: ${{ vars.TF_GRAFANA_CLOUD }}   # endpoints and user ids, not secret
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}   # holds the account ID, so a secret: GitHub masks secrets in logs
      TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.image.outputs.sha }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~1.11"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: eu-west-1
          mask-aws-account-id: true
      - name: Plan
        id: plan
        working-directory: infra/live
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=eu-west-1" >/dev/null
          terraform plan -input=false -no-color -out=tfplan >/dev/null
          ../../deploy/ci/plan-summary.sh tfplan >>"$GITHUB_STEP_SUMMARY"
          ../../deploy/ci/plan-digest.sh tfplan >>"$GITHUB_OUTPUT"

  infra-apply:
    name: terraform apply
    needs: [image, infra-plan]
    if: needs.infra-plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: infra   # main only, and waits for a reviewer to approve the plan above
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_budget_email: ${{ secrets.TF_BUDGET_EMAIL }}
      TF_VAR_grafana_cloud: ${{ vars.TF_GRAFANA_CLOUD }}   # endpoints and user ids, not secret
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}   # holds the account ID, so a secret: GitHub masks secrets in logs
      TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
      APPROVED: ${{ needs.infra-plan.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.image.outputs.sha }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~1.11"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: eu-west-1
          mask-aws-account-id: true
      # The plan file holds secrets and this repo is public, so it is never uploaded as an
      # artifact. Plan again instead, and apply only if it changes exactly what was approved.
      - name: Plan again and check it matches the approved plan
        working-directory: infra/live
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=eu-west-1" >/dev/null
          terraform plan -input=false -no-color -out=tfplan >/dev/null
          digest=$(../../deploy/ci/plan-digest.sh tfplan | sed -n 's/^digest=//p')
          if [ "$digest" != "$APPROVED" ]; then
            echo "::error::the plan changed since it was approved; re-run the workflow to review it again"
            exit 1
          fi
      - name: Apply
        working-directory: infra/live
        run: terraform apply -input=false -no-color tfplan

  deploy:
    name: deploy to the host
    needs: [image, infra-plan, infra-apply]
    # Runs after a successful (or skipped: nothing to change, or a manual run) infra step.
    if: >-
      !cancelled() && needs.image.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.infra-plan.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.infra-apply.result)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.ready.outputs.url }}
    permissions:
      contents: read
      id-token: write   # for the OIDC token AWS trusts; no AWS keys are stored anywhere
    env:
      SHA: ${{ needs.image.outputs.sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          mask-aws-account-id: true

      - name: Record the image tag
        run: aws ssm put-parameter --name /livedemos/image-tag --type String --value "$SHA" --overwrite >/dev/null

      - name: Run the deploy script on the host
        run: |
          # The Auto Scaling Group can replace the host, so look it up: every host the group
          # has put in service (one, or two during a replacement). A host still starting up
          # isn't a target: it starts from the image tag recorded above anyway.
          name=$(aws ssm get-parameter --name /livedemos-deploy/host-name --query Parameter.Value --output text)
          # shellcheck disable=SC2016  # backticks below are JMESPath literals, not shell
          mapfile -t instances < <(
            aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$name" \
              --query 'AutoScalingGroups[].Instances[?LifecycleState==`InService`].InstanceId' --output text |
              tr '\t' '\n' | grep .
          )
          if [ "${#instances[@]}" -eq 0 ]; then
            echo "::error::no host in service for $name"
            exit 1
          fi
          params=$(jq -nc --arg cmd "/opt/livedemos/deploy/host/deploy.sh $SHA" '{commands: [$cmd]}')
          command=$(aws ssm send-command --instance-ids "${instances[@]}" --document-name AWS-RunShellScript \
            --comment "deploy $SHA" --parameters "$params" --query Command.CommandId --output text)

          failed=0
          for instance in "${instances[@]}"; do
            status=Pending
            for _ in $(seq 1 90); do   # up to 7.5 minutes; most of it is the image pull
              sleep 5
              status=$(aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
                --query Status --output text 2>/dev/null || echo Pending)
              case "$status" in Success | Failed | Cancelled | TimedOut) break ;; esac
            done
            echo "== $instance: $status"
            aws ssm get-command-invocation --command-id "$command" --instance-id "$instance" \
              --query '[StandardOutputContent, StandardErrorContent]' --output text || true
            [ "$status" = Success ] || failed=1
          done
          if [ "$failed" != 0 ]; then
            echo "::error::the deploy script failed on a host"
            exit 1
          fi

      - name: Wait for /readyz through CloudFront
        id: ready
        run: |
          domain=$(aws ssm get-parameter --name /livedemos-deploy/api-domain --query Parameter.Value --output text)
          echo "url=https://$domain/v1/wikipedia/live.json" >>"$GITHUB_OUTPUT"
          for _ in $(seq 1 24); do   # 2 minutes
            if curl -fsS --max-time 5 "https://$domain/readyz"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "::error::/readyz wasn't green within 2 minutes of the deploy"
          exit 1
