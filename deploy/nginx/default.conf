# Local stand-in for CloudFront: static files plus a short cache in front of the API.
# The behaviour to mirror is "many viewers, one origin request per second".

proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:10m max_size=50m inactive=10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve `api` through Docker's DNS on each request instead of once at startup.
    # nginx then starts even when the api isn't up yet, and follows it when the api
    # container is recreated with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $api_upstream http://api:8000;

    location / {
        try_files $uri $uri/ =404;
    }

    location /v1/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # Fail fast when the api is down, so viewers see the outage instead of waiting.
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;

        proxy_cache api;
        # Respect the API's Cache-Control (1 s for live.json, 10 s for activity).
        proxy_cache_valid 200 1s;
        # Collapse concurrent misses into one origin request, like CloudFront does.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        # The lock only covers new entries. When an entry expires, `updating` lets one
        # request refresh it while the others get the copy being replaced. Without it,
        # every request in flight at expiry goes to the api, and origin load grows with
        # viewers (measured: 0.6/s at 100 viewers, 0.9/s at 1,000; 0.5/s with this line).
        # Errors still get no stale copy: with the api down, viewers get the 502 and the
        # widget, which dates every copy by its own `as_of`, says "Paused".
        proxy_cache_use_stale updating;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location = /healthz {
        proxy_pass $api_upstream;
    }
}
