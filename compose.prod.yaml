# Production override, used on the EC2 host:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# Same services as local, minus the dev conveniences. Secrets come from .env, which
# deploy/host/render-env.sh writes from SSM Parameter Store on every deploy.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-image: &image
  image: ghcr.io/divine-hope/portfolio-live-demos:${IMAGE_TAG:?IMAGE_TAG is not set}
  pull_policy: missing

services:
  clickhouse:
    ports: !reset []          # reachable only on the Docker network
    logging: *logging

  migrate:
    <<: *image
    build: !reset null
    environment:
      ARCHIVE_URL: ${ARCHIVE_URL:?ARCHIVE_URL is not set}
      ARCHIVE_NOSIGN: "false"
    depends_on: !override
      clickhouse:
        condition: service_healthy
    logging: *logging

  ingest:
    <<: *image
    ports: !reset []
    # If the host runs out of memory, the kernel kills the archive first, then the API
    # (CloudFront serves the fallback), and ingest last: the stream is the one thing
    # that can't wait. Each container also has its own cap (mem_limit in compose.yaml).
    oom_score_adj: -500
    logging: *logging

  api:
    <<: *image
    oom_score_adj: 300
    environment:
      API_ORIGIN_SECRET: ${API_ORIGIN_SECRET:?API_ORIGIN_SECRET is not set}
      API_SNAPSHOT_BUCKET: ${API_SNAPSHOT_BUCKET:-}   # fallback copy for CloudFront
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}     # credentials: the instance role
      API_DRILL_5XX: ${API_DRILL_5XX:-false}          # fire drills only (docs/runbook.md)
    ports: !override
      - "80:8000"             # CloudFront's origin; the security group allows only CloudFront
    logging: *logging

  archive:
    <<: *image
    oom_score_adj: 500        # catches up on its next run
    environment:
      ARCHIVE_URL: ${ARCHIVE_URL:?ARCHIVE_URL is not set}   # the archive bucket, signed
      ARCHIVE_NOSIGN: "false"
      ARCHIVE_ONLY_ON_IP: ${HOST_PUBLIC_IP:-}                  # only the live host archives
      ARCHIVE_COST_TAG: project=livedemos                      # month-to-date cost, daily
      ARCHIVE_COST_CLAIMS: ${ARCHIVE_COST_CLAIMS:-}            # one caller a day (ops/cost.py)
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}              # for the claims bucket
    depends_on: !override
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *logging

  # Metrics and logs to Grafana Cloud (deploy/alloy/config.alloy, ADR 0008). Production
  # only: locally there's nowhere to send them. It reads the host's /proc and /sys, and
  # the Docker socket for container logs and memory. The socket is root-equivalent, read-
  # only or not, so the image is pinned by digest: it's trusted like the host itself.
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_PROM_URL: ${GRAFANA_PROM_URL:-}
      GRAFANA_PROM_USER: ${GRAFANA_PROM_USER:-}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
      GOMEMLIMIT: 110MiB      # the Go runtime collects well before the container cap
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # cAdvisor finds each container's layer here. Not /var/lib/docker/containers: the
      # containers' configs hold their environment, passwords included.
      - /var/lib/docker/image:/var/lib/docker/image:ro
    cgroup: host              # cAdvisor reads every container's cgroup
    mem_limit: 200m           # 120 MB measured in production, 2026-10-07
    oom_score_adj: 800        # the first to go: losing metrics for a minute costs nothing
    logging: *logging

  web:
    profiles: ["local-only"]  # CloudFront and Cloudflare Pages replace it in production

  fake-stream:
    profiles: ["local-only"]

  s3:
    profiles: ["local-only"]   # the real archive bucket in production

  s3-bucket:
    profiles: ["local-only"]

volumes:
  alloy-data:   # Alloy's write-ahead log, so a restart doesn't drop the last minutes
