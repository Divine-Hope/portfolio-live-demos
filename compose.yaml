# Local stack. Production runs the same services on one EC2 host (see docs/architecture.md),
# with CloudFront in place of the `web` container.
#
#   make up            real Wikimedia stream (needs INGEST_CONTACT in .env)
#   make up-offline    fake stream, no internet needed
#
# Open http://localhost:8080 for the widget inside a demo host page.

name: livedemos

# The image is built once, by `migrate`, and reused by every Python service.
# (Several services building the same tag at once can collide on Docker Desktop.)
x-app: &app
  image: livedemos:local
  pull_policy: never
  restart: unless-stopped
  depends_on:
    clickhouse:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    restart: unless-stopped
    environment:
      # An admin user for migrations from your laptop and integration tests. Local only.
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?copy .env.example to .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # Read by clickhouse/users.d/livedemos.xml for the application users.
      CLICKHOUSE_MIGRATOR_PASSWORD: ${CLICKHOUSE_MIGRATOR_PASSWORD:?copy .env.example to .env}
      CLICKHOUSE_INGEST_PASSWORD: ${CLICKHOUSE_INGEST_PASSWORD:?copy .env.example to .env}
      CLICKHOUSE_API_PASSWORD: ${CLICKHOUSE_API_PASSWORD:?copy .env.example to .env}
      CLICKHOUSE_ARCHIVER_PASSWORD: ${CLICKHOUSE_ARCHIVER_PASSWORD:?copy .env.example to .env}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/config.d/s3.xml:/etc/clickhouse-server/config.d/s3.xml:ro
      - ./clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./clickhouse/users.d/livedemos.xml:/etc/clickhouse-server/users.d/livedemos.xml:ro
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: 1200m
    healthcheck:
      # /ping needs no credentials, so no password lands on a command line.
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    image: livedemos:local
    command: ["livedemos-migrate"]
    restart: "no"
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: migrator   # the only user that can change the schema
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_MIGRATOR_PASSWORD}
      # For rebuilding the rollup from the archive (make rebuild-rollups).
      ARCHIVE_URL: http://s3:8333/archive/wikipedia/edits
      ARCHIVE_NOSIGN: "true"
      # A host that lost its raw rows refills the rollup from the archive before ingest
      # starts (rollup/restore.py). `ARCHIVE_RESTORE=false make up` skips that.
      ARCHIVE_RESTORE: ${ARCHIVE_RESTORE:-true}
      CLICKHOUSE_TIMEOUT_S: "300"   # a restore reads a day of Parquet per query
    depends_on:
      clickhouse:
        condition: service_healthy
      s3-bucket:
        condition: service_completed_successfully

  ingest:
    <<: *app
    command: ["livedemos-ingest"]
    stop_grace_period: 15s   # a clean stop: see ingest/__main__.py
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ingest
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_INGEST_PASSWORD}
      INGEST_CONTACT: ${INGEST_CONTACT:-}
      INGEST_STREAM_URL: ${INGEST_STREAM_URL:-https://stream.wikimedia.org/v2/stream/recentchange}
    ports:
      - "127.0.0.1:9101:9101"   # Prometheus metrics, for poking at locally
    mem_limit: 192m
    healthcheck:
      # Healthy means the consumer loop is alive, not just the process.
      test: ["CMD", "livedemos-ingest-health"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    <<: *app
    command: ["uvicorn", "livedemos.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: api
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_API_PASSWORD}
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Every finished hour of raw edits, as one Parquet file in S3.
  archive:
    <<: *app
    command: ["livedemos-archive"]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: archiver
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ARCHIVER_PASSWORD}
      ARCHIVE_URL: http://s3:8333/archive/wikipedia/edits
      ARCHIVE_NOSIGN: "true"
    depends_on:
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      s3-bucket:
        condition: service_completed_successfully
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Local stand-in for S3. MinIO no longer publishes images; SeaweedFS speaks the same API.
  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-s3", "-dir=/data"]
    volumes:
      - s3-data:/data
    ports:
      - "127.0.0.1:8333:8333"
    mem_limit: 256m

  s3-bucket:
    image: chrislusf/seaweedfs:4.48
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        for _ in $$(seq 1 60); do
          echo "s3.bucket.list" | weed shell -master=s3:9333 2>/dev/null | grep -q " archive" && exit 0
          echo "s3.bucket.create -name archive" | weed shell -master=s3:9333 >/dev/null 2>&1
          sleep 1
        done
        exit 1
    depends_on:
      - s3

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    mem_limit: 64m
    healthcheck:
      # The static site alone: the web container is healthy even while the api restarts.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - api

  # Offline mode: a stand-in for Wikimedia EventStreams. `make up-offline` points ingest at it.
  fake-stream:
    image: livedemos:local
    pull_policy: never
    profiles: ["offline"]
    restart: unless-stopped
    command: ["python", "-m", "devtools.fake_eventstreams", "--port", "8090", "--rate", "30", "--drop-after-s", "300"]
    volumes:
      - ./devtools:/app/devtools:ro   # dev tools aren't in the package, so not in the image
    mem_limit: 256m

# Pinned, because ClickHouse lets its users connect from this range only
# (clickhouse/users.d/livedemos.xml).
networks:
  default:
    enable_ipv6: false   # users.d allows IPv4 from this range only
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  clickhouse-data:
  s3-data:
